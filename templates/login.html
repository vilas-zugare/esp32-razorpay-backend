{% extends "base.html" %}

{% block navbar %}
<!-- Hide navbar on login page -->
{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="glass p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in">
        
        <div class="text-center mb-8">
            <div class="inline-block bg-primary/20 text-primary p-4 rounded-full mb-4">
                <i class="fa-solid fa-shield-halved text-4xl"></i>
            </div>
            <h1 class="text-3xl font-bold">Admin Portal</h1>
            <p class="text-gray-400 mt-2 text-sm">Sign in to manage your devices and payments.</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6 flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" name="username" id="username" required
                        class="w-full pl-10 pr-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent text-white outline-none transition-all placeholder-gray-500"
                        placeholder="Enter username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" name="password" id="password" required
                        class="w-full pl-10 pr-4 py-3 bg-gray-800/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent text-white outline-none transition-all placeholder-gray-500"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-primary/30 transition-all transform hover:-translate-y-1">
                Sign In <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
